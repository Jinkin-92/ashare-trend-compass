<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一级行业详情 - A-Share Trend Compass</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 id="l1-name">加载中...</h1>
    <p id="l1-meta" class="muted">--</p>
    <nav class="breadcrumb">
      <a href="index.html">← 返回一级品种</a>
    </nav>
  </header>

  <main>
    <section id="trend-section">
      <h2>趋势变化（近 90 天）</h2>
      <div class="trend-grid">
        <div class="trend-card">
          <div class="trend-title">温度档位</div>
          <div id="chart-temp" style="width:100%;height:260px;"></div>
        </div>
        <div class="trend-card">
          <div class="trend-title">RS 排名（百分位）</div>
          <div id="chart-rs" style="width:100%;height:260px;"></div>
        </div>
        <div class="trend-card">
          <div class="trend-title">右侧天数</div>
          <div id="chart-right" style="width:100%;height:260px;"></div>
        </div>
      </div>
    </section>

    <section id="l2-section">
      <h2>二级行业（点击进入个股列表）</h2>
      <div class="toolbar-row">
        <input type="text" id="search-input" placeholder="搜索二级行业名称 / 代码">
        <label><input type="checkbox" id="watch-only"> 只看自选</label>
      </div>
      <div id="l2-container"></div>
    </section>
  </main>

  <footer>
    <p>免责声明：本工具仅供研究参考，不构成投资建议。</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="js/list-shared.js?v=20260803"></script>
  <script src="js/l1.js?v=20260803"></script>
</body>
</html>
